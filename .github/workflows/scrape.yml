name: Scrape & Deploy

on:
  schedule:
    # Four runs a day, in UTC (GitHub cron has no timezone). The evening
    # trio is pinned for EST — the heart of the season — and reads an hour
    # later (9/11 PM + 1 AM) during the EDT shoulder months; treat all of
    # them as targets anyway, since GitHub's scheduler is best-effort and
    # has fired hours late here before. Parents check standings right after
    # their kid's game, so the evening wave runs are the point:
    #   01:00 — 8 PM ET: the first wave of games (starts from 6:10, done
    #           ~7:20) into standings.
    #   03:00 — 10 PM ET: the middle waves (7:20–9:40 starts).
    #   05:00 — midnight ET: sweeps the tail — the last start is 22:05 and
    #           the ice is clear by ~23:15.
    #   13:00 — morning catch-up (8–9 AM ET): late strays, overnight
    #           corrections, and insurance if an evening run dies. Every
    #           run is full: schedules (a flat 9 calls) plus the standings
    #           walk — a division-by-game-type postback walk costing 25
    #           calls unpublished and up to 95 once tables are live. The
    #           bot only commits when data actually changed.
    # Season scope stays 'current' + ALL, probing only divisions the data
    # proves exist — see the division hint in nyhl_scrape.py. 25-26 U14 was
    # pulled once on 2026-09-24 and is served from its snapshot; it is
    # deliberately not re-hit.
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to scrape ('current', or name a finished season like 25-26 to re-pull it for real)"
        required: false
        default: "current"
      division:
        description: "Division filter (e.g. U15 to scope down, or ALL)"
        required: false
        # ALL: pull every division the current season is playing. The
        # snapshot merges per division, so this accumulates rather than
        # replacing what has already been collected; name a division to
        # scope a manual run down to one.
        default: "ALL"
      mode:
        description: "What to scrape: full (schedules + standings), schedule (cheap, 9 calls), or standings"
        required: false
        default: "full"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape NYHL Data
    runs-on: ubuntu-latest
    continue-on-error: true
    # The build must see the commit this run just made. actions/checkout
    # defaults to GITHUB_SHA, which for workflow_dispatch was resolved when the
    # run was dispatched — before the scrape step committed — so every run was
    # deploying the *previous* run's data.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: |
          season="$IN_SEASON"
          division="$IN_DIVISION"
          mode="$IN_MODE"
          # Cron events carry no inputs, and every scheduled run is a full
          # one now: the morning catch-up plus the evening wave runs that
          # put each night's results into standings within about an hour
          # of the last whistle. Dispatches pick their own mode (default:
          # full), and the mapping below still honours a schedule-only
          # dispatch.
          if [ -z "$mode" ]; then
            mode="full"
          fi
          mode_flag=""
          case "$mode" in
            schedule) mode_flag="--schedule-only" ;;
            standings) mode_flag="--standings-only" ;;
          esac
          echo "Scrape mode: $mode"
          # A finished season is normally served straight from its snapshot
          # with zero requests. Naming one explicitly means "pull it for
          # real", so pass --force. 'current' never needs it, and the crons
          # stay on the current season alone: last season (25-26 U14) was
          # pulled once on 2026-09-24 and is not re-hit daily. ALL is the
          # whole current season; the scraper only walks divisions its data
          # can vouch for, so widening the scope does not mean probing every
          # empty dropdown entry.
          force_flag=""
          if [ "$season" != "current" ]; then force_flag="--force"; fi
          python scraper/nyhl_scrape.py \
            --season "$season" \
            --division "$division" \
            $mode_flag \
            $force_flag \
            --verbose
        env:
          PYTHONUNBUFFERED: "1"
          # Dispatch inputs reach the shell only as environment *data*.
          # GitHub expands ${{ ... }} into the script text before bash parses
          # it, so interpolating github.event.inputs.* straight into `run:`
          # would let a crafted input break out of its quotes and execute —
          # the documented script-injection pattern. Values set here are
          # never re-parsed as code, so even a hostile dispatch input stays
          # an inert string. (Dispatching needs write access anyway, but the
          # script should hold that line on its own.)
          IN_SEASON: ${{ github.event.inputs.season || 'current' }}
          IN_DIVISION: ${{ github.event.inputs.division || 'ALL' }}
          IN_MODE: ${{ github.event.inputs.mode || '' }}
          IN_SCHEDULE: ${{ github.event.schedule }}

      - name: Validate output
        run: |
          python - <<'PY'
          import glob, json, os, sys

          files = sorted(glob.glob("public/data/*.json"))
          if not files:
              print("No JSON files in public/data/")
              sys.exit(1)
          for f in files:
              try:
                  with open(f) as fh:
                      data = json.load(fh)
              except json.JSONDecodeError as e:
                  print(f"{f}: INVALID JSON: {e}")
                  sys.exit(1)
              count = len(data.get("games", data.get("standings", [])))
              print(f"{f}: OK season={data.get('season', '?')} ({count} entries)")
              # A per-season snapshot legitimately holds only the divisions
              # scraped for it, and an unpublished season holds no rows — both
              # are warnings. Only the default files must be non-empty, since
              # they are what the app falls back to when a snapshot is absent.
              if count == 0 and os.path.basename(f) in ("schedule.json", "standings.json"):
                  print(f"WARNING: {f} has 0 entries")
          PY

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # public/images too: newly scraped teams arrive with logo codes the
          # app resolves to public/images/teams/, and an uncommitted logo is
          # a broken image on the live site even though the JSON references it.
          git add public/data/ public/images/
          git diff --staged --quiet || git commit -m "Update NYHL data snapshot [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # Data commits are [skip ci], so push CI never sees them: gate this
    # deploy on the suites reading the snapshot the scrape just made —
    # bad standings merge into main, but they do not reach Pages.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.scrape.outputs.sha || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scraper unit tests
        run: |
          python tests/nyhl_merge_test.py
          python tests/nyhl_health_test.py
          python tests/nyhl_eventid_test.py

      - name: Standings vs schedule data agreement
        run: python tests/nyhl_fullcheck.py

  build:
    name: Build & Deploy
    needs: [scrape, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fall back to the branch tip when the scrape step never ran (it
          # aborts non-zero on a bad fetch) so we still deploy current data.
          ref: ${{ needs.scrape.outputs.sha || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Cached copies of the old index.html (CDN, browser and service worker
      # all hold it for ~10 minutes) still ask for the previous bundle. Deleting
      # it hands those visitors a blank page, so carry it forward.
      - name: Keep previous deployment's assets
        run: bash scripts/keep-previous-assets.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
