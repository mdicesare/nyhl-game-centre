name: Scrape & Deploy

on:
  schedule:
    # 6:00 AM ET daily (10:00 UTC). Current season only — the cron asks for
    # 'current' + U15, and the tier walk inside the scraper covers every tier
    # of that division. 25-26 U14 was pulled once on 2026-09-24 and is served
    # from its snapshot; it is deliberately not re-hit every day.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to scrape ('current', or name a finished season like 25-26 to re-pull it for real)"
        required: false
        default: "current"
      division:
        description: "Division filter (e.g. U15 or ALL)"
        required: false
        # U15 for now: that is the division we are following for 26-27. The
        # snapshot merges per division, so widening this later accumulates
        # rather than replacing what has already been collected.
        default: "U15"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape NYHL Data
    runs-on: ubuntu-latest
    continue-on-error: true
    # The build must see the commit this run just made. actions/checkout
    # defaults to GITHUB_SHA, which for workflow_dispatch was resolved when the
    # run was dispatched — before the scrape step committed — so every run was
    # deploying the *previous* run's data.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: |
          season="${{ github.event.inputs.season || 'current' }}"
          division="${{ github.event.inputs.division || 'U15' }}"
          # A finished season is normally served straight from its snapshot
          # with zero requests. Naming one explicitly means "pull it for
          # real", so pass --force. 'current' never needs it, and the cron
          # stays on the current season alone: last season (25-26 U14) was
          # pulled once on 2026-09-24 and is not re-hit daily.
          force_flag=""
          if [ "$season" != "current" ]; then force_flag="--force"; fi
          python scraper/nyhl_scrape.py \
            --season "$season" \
            --division "$division" \
            $force_flag \
            --verbose
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate output
        run: |
          python - <<'PY'
          import glob, json, os, sys

          files = sorted(glob.glob("public/data/*.json"))
          if not files:
              print("No JSON files in public/data/")
              sys.exit(1)
          for f in files:
              try:
                  with open(f) as fh:
                      data = json.load(fh)
              except json.JSONDecodeError as e:
                  print(f"{f}: INVALID JSON: {e}")
                  sys.exit(1)
              count = len(data.get("games", data.get("standings", [])))
              print(f"{f}: OK season={data.get('season', '?')} ({count} entries)")
              # A per-season snapshot legitimately holds only the divisions
              # scraped for it, and an unpublished season holds no rows — both
              # are warnings. Only the default files must be non-empty, since
              # they are what the app falls back to when a snapshot is absent.
              if count == 0 and os.path.basename(f) in ("schedule.json", "standings.json"):
                  print(f"WARNING: {f} has 0 entries")
          PY

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # public/images too: newly scraped teams arrive with logo codes the
          # app resolves to public/images/teams/, and an uncommitted logo is
          # a broken image on the live site even though the JSON references it.
          git add public/data/ public/images/
          git diff --staged --quiet || git commit -m "Update NYHL data snapshot [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Deploy
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fall back to the branch tip when the scrape step never ran (it
          # aborts non-zero on a bad fetch) so we still deploy current data.
          ref: ${{ needs.scrape.outputs.sha || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Cached copies of the old index.html (CDN, browser and service worker
      # all hold it for ~10 minutes) still ask for the previous bundle. Deleting
      # it hands those visitors a blank page, so carry it forward.
      - name: Keep previous deployment's assets
        run: bash scripts/keep-previous-assets.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
