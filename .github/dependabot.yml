# Automated dependency PRs — added in the 2026-10-03 security review.
# Dependabot *alerts* are on by default for public repos, but nothing was
# opening update PRs: deps only moved when someone happened to notice.
# Three ecosystems cover every supply chain this repo has — the app bundle
# (npm), the scrape job (pip), and the CI itself (github-actions).
#
# These PRs trigger no workflows (neither workflow listens to pull_request);
# the normal Tests job runs only once a PR lands on main.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v6 of the React plugin requires Vite 8; this app is on Vite 5, so a
      # bump alone cannot satisfy its peer range and would fail npm ci.
      # Revisit inside a deliberate Vite migration, never as routine churn.
      - dependency-name: "@vitejs/plugin-react"
        versions: [">= 5.0.0"]
      # Tailwind v4 is a config-format migration (the PostCSS plugin moved
      # to @tailwindcss/postcss, @tailwind directives became @import,
      # autoprefixer is built in) — a package.json-only bump breaks the
      # CSS build. Take it as a project or stay on v3.
      - dependency-name: "tailwindcss"
        versions: [">= 4.0.0"]
      # Vite 6+ is a triple-major build-toolchain migration (rolldown-era;
      # engines, peers, config and output all shift). Same policy as the
      # plugin above: a deliberate project, not weekly churn — and
      # vite-plugin-pwa moves with it when it happens.
      - dependency-name: "vite"
        versions: [">= 6.0.0"]
      # 1.x is a major on the SW/manifest generator (workbox 7 peer set);
      # every merge regenerates sw.js + the precache list. Gate it on a
      # local battery (404check's SW/manifest/offline checks), not a
      # weekly PR.
      - dependency-name: "vite-plugin-pwa"
        versions: [">= 1.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/scraper"
    schedule:
      interval: "weekly"
