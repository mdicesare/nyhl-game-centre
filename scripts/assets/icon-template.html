<!doctype html>
<!--
  Source-art renderer for the PWA icons.

  puck-stick.svg (Twemoji hockey stick-and-puck, CC BY 4.0) is drawn at
  512x512 on a transparent background; the screenshot becomes
  scripts/assets/puck-stick-art-512.png, which scripts/make-icons.js
  composites onto the navy tile for every icon size.

  Re-render with:

    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new
      --disable-gpu --no-first-run --hide-scrollbars
      --user-data-dir=%TEMP%\nyhl-icon
      --default-background-color=00000000
      --window-size=512,512
      --screenshot="...\scripts\assets\puck-stick-art-512.png"
      file:///C:/work/nyhl/app/scripts/assets/icon-template.html

  512 is well above the ~300px window width where headless Chrome mis-lays
  out pages, so this render is safe (the smaller sizes are box-filtered from
  it in Node, deterministically).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }
      svg {
        display: block;
        width: 512px;
        height: 512px;
      }
    </style>
  </head>
