    <script type="text/javascript">
        var client = 'NYHL';
        g_DynamicLoading.css("../App_Themes/" + 'NYHL' + "/Main.css");

        function GoBack() {
            window.location.href = "Standings.aspx?event=" + g_EventID[client].Standings;
        }

        $(function () {
            $('#divFrom').datepicker({ format: 'dd-M-yyyy', autoclose: true });
            $('#divTo').datepicker({ format: 'dd-M-yyyy', autoclose: true });

            try {
                $.tablesorter.addParser({
                    // set a unique id 
                    id: 'DOW',
                    is: function (s) {
                        return false;
                    },
                    format: function (s, table, cell, cellIndex) {
                        return $.tablesorter.formatFloat(new Date($(cell).attr('data')).getTime());
                    },
                    // set type, either numeric or text 
                    type: 'text'
                });

                $.tablesorter.defaults.headers = { 0: { sorter: 'DOW' }, 1: { sorter: 'time' } };
                $("#sche_repeater").tablesorter();
            }
            catch (e) {
                console.log("Error: " + e.message);
            }

            $("#btnPlayoffs").click(function () {
                window.location.href = "Playoffs.aspx?event=" + g_EventID[client].Playoffs;
            });

            $("#btnStandings").click(function () {
                window.location.href = "Standings.aspx?event=" + g_EventID[client].Standings;
            });

            // link to the html of Champion_Weekend schedules
            $("#btnChampion").click(function (e) {
                e.preventDefault(); // Prevent the default behavior of the radio button

                var url = "https://www.agilex.ca/HTML/" + client + "/ChampionshipWeekend";
                var myModal = new bootstrap.Modal($("#exampleModal"), {});

                loadChampionWeenendImage(url, $("#modalBody"));

                myModal.show();
            });
        });
    </script>
